defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 6-7
    rollout: 4-5
    env: 4-7

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_async_gipo_openpi_pi05_verify"
    logger_backends: ["tensorboard"]

  max_epochs: 200
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 1
  behave_weight_threshold: 2

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1

  adv_type: gae
  loss_type: gipo_actor_critic
  failure_reweight: false
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  replay_buffer:
    min_buffer_size: 8
    enable_cache: true
    cache_size: 8
    sample_window_size: 64
    auto_save: false
    trajectory_format: pt

  gipo:
    advantage_source: recompute
    target_batch_segments: 8
    max_policy_lag: null
    gaussian_sigma: 1.0
    rho_min: 0.0067
    rho_max: 148.0

  async_inference:
    target_batch_size: 32
    max_wait_time_s: 0.01
    request_queue_maxsize: 1024
    inference_timeout_s: 60.0

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    total_num_envs: 128
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 1920
    reward_coef: ${algorithm.reward_coef}
    auto_reset: True
    use_fixed_reset_state_ids: False
    use_ordered_reset_state_ids: False
    task_ids_filter: [0]
    video_cfg:
      save_video: False
    v17_continuous_collect:
      enabled: True
      target_trajectories: 64
    chunk_step_mode: sync_time_major
    latency_balanced_pair:
      envs_per_core: 1
      ema_alpha: 0.3
      initial_latency_ms: null
      dynamic_affinity: True
      core_donation_enabled: False
      core_donation_max_extra_groups: 1
  eval:
    total_num_envs: 48
    auto_reset: True
    ignore_terminations: False
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    task_ids_filter: [0]
    is_eval: True
    video_cfg:
      save_video: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 2

  model:
    model_path: "/data1/gaobowen/model/RLinf-Pi05-LIBERO-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 256
  seed: 1234
  enable_offload: False

  model:
    model_path: "/data1/gaobowen/model/RLinf-Pi05-LIBERO-SFT"
    model_type: "openpi"
    num_action_chunks: 5
    num_steps: 3
    add_value_head: True
    openpi:
      value_after_vlm: True

  optim:
    lr: 2.0e-5
    value_lr: 2.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

defaults:
  - env/robocasa_closedrawer@env.train
  - env/robocasa_closedrawer@env.eval
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: logs/robocasa_realA_profile_openpi
    project_name: rlinf
    experiment_name: robocasa_realA_profile_openpi
    logger_backends: []
  max_epochs: 1
  max_steps: 1
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 4
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: EnvGroup
  enable_offload: false
  train:
    total_num_envs: 32
    max_episode_steps: 640
    max_steps_per_rollout_epoch: 160
    group_size: ${algorithm.group_size}
    reward_coef: ${algorithm.reward_coef}
    chunk_step_mode: sync_time_major
    action_repeat_per_chunk_step: 16
    log_sim_timestamps: true
    log_sim_affinity_interval: 0
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    total_num_envs: 2
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 640
    max_steps_per_rollout_epoch: 40
    group_size: 1
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    is_eval: true
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: robocasa
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /data1/gaobowen/model/RLinf-Pi0-RoboCasa
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 512
  seed: 42
  enable_offload: false
  model:
    model_path: /data1/gaobowen/model/RLinf-Pi0-RoboCasa
    model_type: openpi
    num_action_chunks: 5
    num_steps: 5
    action_dim: 12
    add_value_head: true
    openpi:
      config_name: pi0_robocasa_human
      num_images_in_input: 2
      detach_critic_input: true
      joint_logprob: false
    openpi_data:
      action_space: ${env.train.action_space}
      state_space: ${env.train.state_space}
      image_space: ${env.train.image_space}
    policy_setup: ${env.train.action_space}
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false

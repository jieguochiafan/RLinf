defaults:
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-7

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:ROBOCASA_SFT_LOG_ROOT,../results}
    project_name: rlinf-pi05-robocasa-sft
    experiment_name: ${oc.env:ROBOCASA_SFT_EXPERIMENT,pi05_robocasa365_closedrawer_sft}
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 100000
  val_check_interval: -1
  save_interval: 5000

data:
  train_data_paths: ${oc.env:ROBOCASA_SFT_DATA,/path/to/robocasa365_closedrawer_lerobot}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 256
  seed: 0

  model:
    precision: null
    model_path: ${oc.env:ROBOCASA_MODEL_PATH,/path/to/model/pi05_base_rlinf}
    num_action_chunks: 5
    action_dim: 12
    add_value_head: False
    openpi:
      config_name: "pi05_robocasa365_closedrawer"
      detach_critic_input: True
      num_images_in_input: 2
      train_expert_only: False
    openpi_data:
      dataset_schema: "unified"
      action_space: "12d"
      state_space: "16d"
      image_space: "2views"

  optim:
    lr: 5.0e-5
    value_lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 10000
    lr_scheduler: "constant"

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlinf-rollout"
version = "0.1.0.dev0"
authors = [{ name = "RLinf Contributors" }]
description = "Standalone rollout system for embodied and LLM policies (RLinf)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["reinforcement-learning", "rollout", "embodied-intelligence", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

# Core dependencies only: Ray-based scheduling plus tensor plumbing. The rollout
# system never depends on the training-side `rlinf` package.
dependencies = [
    "ray[default]>=2.47.0",
    "torch>=2.5.0",
    "numpy",
    "hydra-core",
    "omegaconf",
    "sortedcontainers",
]

[project.optional-dependencies]
embodied = [
    "transformers>=4.51,<=4.57.6",
    "peft",
    "timm",
    "torchcodec",
    "imageio[ffmpeg]",
    "gymnasium",
    "gym",
]
sglang = [
    "sglang[all]>=0.4.6.post5,<0.5",
    "sglang-router",
    "torch-memory-saver",
    "transformers>=4.51.1,<4.52",
    "uvloop==0.21.0",
]
vllm = [
    "vllm>=0.8.5,<0.9",
    "transformers>=4.51.1,<4.52",
    "uvloop==0.21.0",
]
dev = ["pytest", "ruff"]

# Phase 4 registers the daemon entry point here:
#   [project.scripts]
#   rollout-serve = "rlinf_rollout.serve.main:main"

# The package directory doubles as the project root, so that `rlinf_rollout` is
# importable straight from the RLinf checkout and the very same layout keeps
# working after `git subtree split` moves this directory to a repo root.
# New sub-packages must be appended to `packages` (Phase 1+).
[tool.setuptools]
include-package-data = true
package-dir = { "rlinf_rollout" = "." }
packages = ["rlinf_rollout", "rlinf_rollout.api", "rlinf_rollout.api.v1"]

[tool.setuptools.package-data]
rlinf_rollout = ["**/*.yaml", "**/*.yml"]

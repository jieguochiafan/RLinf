[tool.setuptools.package-data]
# The explicit `.hydra` entry is required: setuptools' recursive globs skip
# dot-directories, and CalvinEnv loads its scene configs from there at runtime.
rlinf_rollout = [
    "**/*.yaml",
    "**/*.yml",
    "**/*.json",
    "**/*.jsonl",
    "envs/calvin/calvin_cfg/.hydra/*.yaml",
]
